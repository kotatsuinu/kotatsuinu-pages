<script>
(function() {
  'use strict';

  // ---- Minimal markdown → tree parser (headings + bullets only) ----
  function parseMd(md) {
    const lines = md.split('\n');
    const root = { content: '', children: [] };
    const stack = [{ node: root, depth: -1 }];

    for (const raw of lines) {
      const line = raw.replace(/\s+$/, '');
      if (!line.trim()) continue;

      let depth, content;
      const h = line.match(/^(#+)\s+(.+)$/);
      const b = line.match(/^(\s*)-\s+(.+)$/);

      if (h) {
        depth = h[1].length;
        content = h[2];
      } else if (b) {
        const indent = b[1].length;
        depth = 10 + Math.floor(indent / 2);
        content = b[2];
      } else {
        continue;
      }

      content = content.replace(/\*\*(.+?)\*\*/g, '$1');

      while (stack.length > 1 && stack[stack.length - 1].depth >= depth) {
        stack.pop();
      }

      const node = { content, children: [] };
      stack[stack.length - 1].node.children.push(node);
      stack.push({ node, depth });
    }

    if (root.children.length === 1) return root.children[0];
    return root;
  }

  function init() {
    const md = document.getElementById('mm-source').textContent;
    const tree = parseMd(md);

    const { Markmap, deriveOptions } = window.markmap;
    const svg = document.getElementById('mm-svg');

    const options = deriveOptions ? deriveOptions({
      colorFreezeLevel: 2,
      initialExpandLevel: 3,
      duration: 300,
      maxWidth: 240
    }) : { duration: 300, maxWidth: 240 };

    const mm = Markmap.create(svg, options, tree);

    function refit() {
      try { mm.fit(); } catch (e) { /* ignore */ }
    }

    // 初回フィット（フォント・レイアウト安定後）
    setTimeout(refit, 120);
    setTimeout(refit, 500);

    // リサイズ追従
    window.addEventListener('resize', refit);
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(refit);
      ro.observe(svg.parentElement);
    }

    // コントロール
    document.getElementById('mm-fit').addEventListener('click', refit);
    document.getElementById('mm-zoom-in').addEventListener('click', () => {
      try { mm.rescale(1.25); } catch (e) {}
    });
    document.getElementById('mm-zoom-out').addEventListener('click', () => {
      try { mm.rescale(0.8); } catch (e) {}
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
